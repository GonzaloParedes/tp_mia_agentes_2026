<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="840" viewBox="0 0 1280 840">
<style>
text{font-family:Arial,Helvetica,sans-serif;fill:#172033}
.page-title{font-size:26px;font-weight:700}
